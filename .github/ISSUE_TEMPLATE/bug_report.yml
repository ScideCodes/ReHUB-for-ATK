name: Bug report
description: Something in the app behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and connection
      placeholder: e.g. ATK ZERO EX, 8K receiver, or demo mode
  - type: input
    id: browser
    attributes:
      label: ReHUB version and Windows version
      placeholder: e.g. ReHUB 1.5.2 on Windows 11
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Paste the redacted report from the Diagnostics panel, if relevant. It never includes names, serials or payloads.
      render: text

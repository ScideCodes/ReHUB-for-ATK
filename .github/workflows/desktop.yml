name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'scripts/desktop-smoke.mjs'
      - 'scripts/support-smoke.mjs'
      - 'scripts/installer-details.mjs'
      - 'scripts/packaged-smoke.mjs'
      - 'package*.json'
      - 'electron-builder.yml'
      - 'electron/linux/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [desktop-source]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:desktop
      - run: npm test -- --pool=threads --maxWorkers=2
      - run: npx eslint src electron scripts/desktop-smoke.mjs scripts/packaged-smoke.mjs scripts/installer-details.mjs
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:support:browser
      - run: npm run test:desktop:smoke
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged application smoke
        run: node scripts/packaged-smoke.mjs "release/win-unpacked/ReHUB for ATK.exe"
      - name: Installer directory safety fixtures
        run: npm run test:desktop
        env:
          REHUB_REQUIRE_NSIS_TEST: '1'
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/ReHUB-Setup-*-x64.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -LiteralPath release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ReHUB-Windows-x64
          path: |
            release/ReHUB-Setup-*-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence
          path: audit/desktop/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's sandbox needs for the unpacked test build.
      # Installed .deb packages ship an AppArmor profile instead; this only affects the CI runner.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run test:desktop
      - run: npm test -- --pool=threads --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:desktop:smoke
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Packaged application smoke
        run: xvfb-run -a node scripts/packaged-smoke.mjs release/linux-unpacked/re-hub-for-atk
      - name: Package contents
        run: dpkg-deb -c release/ReHUB-*-linux-amd64.deb | grep -q 'usr/lib/udev/rules.d/70-rehub-atk.rules'
      - name: Checksums
        run: cd release && sha256sum ReHUB-*-linux-* > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReHUB-Linux-x64
          path: |
            release/ReHUB-*-linux-*.AppImage
            release/ReHUB-*-linux-*.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm test -- --pool=threads --maxWorkers=2
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:desktop:smoke
      - run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged application smoke
        run: node scripts/packaged-smoke.mjs "release/mac-universal/ReHUB for ATK.app/Contents/MacOS/ReHUB for ATK"
      - name: Checksums
        run: cd release && shasum -a 256 ReHUB-*-mac-*.dmg > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReHUB-macOS-universal
          path: |
            release/ReHUB-*-mac-*.dmg
            release/SHA256SUMS-mac.txt
          if-no-files-found: error

